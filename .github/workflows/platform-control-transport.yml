name: Platform Control transport

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/platform-control-transport.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'src/control/**'
      - 'src/process-runtime/**'
      - 'src/runtime/process-child-session-factory.ts'
      - 'tests/*control*.test.ts'
      - 'tests/support/**'
      - 'tests/fixtures/process-runtime-child-extension.ts'

permissions:
  contents: read

jobs:
  control-transport:
    name: ${{ matrix.os }} Control transport
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:fast -- --file=control-protocol-schemas.test.ts
      - if: runner.os == 'macOS'
        run: npm run test:process -- --file=unix-control-transport.test.ts
        env:
          # Test fixtures add a directory below the runner temp root; keep that
          # fixture-only nesting within macOS sockaddr_un limits.
          TMPDIR: /tmp
      - if: runner.os == 'Windows'
        run: npm run test:process -- --file=named-pipe-control-transport.test.ts
      - if: runner.os == 'Windows'
        run: npm run test:process -- --file=windows-process-control-transport.test.ts
